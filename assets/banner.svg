<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0d1326" />
      <stop offset="100%" stop-color="#070b16" />
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1000" height="280" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2" />
  <rect width="1000" height="280" rx="16" fill="url(#grid)" />

  <!-- Top & Bottom Neon Borders -->
  <rect x="100" y="1" width="800" height="2" fill="url(#borderGrad)" />
  <rect x="100" y="277" width="800" height="2" fill="url(#borderGrad)" />

  <!-- HUD Corner Brackets -->
  <path d="M 25 50 L 25 25 L 55 25" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 975 50 L 975 25 L 945 25" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 25 230 L 25 255 L 55 255" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 975 230 L 975 255 L 945 255" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />

  <!-- Top Telemetry Bar -->
  <g font-family="'Courier New', Courier, monospace" font-size="11" fill="#64748b" letter-spacing="1.5">
    <circle cx="50" cy="42" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="64" y="46" fill="#94a3b8" font-weight="bold">SYS.ONLINE // NODE: SARTHAK-THEPROBRO</text>
    <text x="730" y="46" fill="#38bdf8">STATUS: BUILDING FULL-STACK &amp; AI</text>
  </g>

  <!-- Main Heading -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="50" y="115" font-size="16" font-weight="600" fill="#38bdf8" letter-spacing="3">
      HELLO WORLD, I AM
    </text>
    <text x="50" y="168" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="1">
      SARTHAK SUMAN
    </text>
    <rect x="52" y="182" width="420" height="4" rx="2" fill="url(#cyanGlow)">
      <animate attributeName="width" values="120;480;120" dur="6s" repeatCount="indefinite" />
    </rect>
    <text x="50" y="218" font-size="19" font-weight="500" fill="#cbd5e1">
      Full-Stack Software Engineer <tspan fill="#38bdf8">|</tspan> Node.js • React • MySQL • AI Integrations
    </text>
  </g>

  <!-- Right Side Futuristic Terminal Card -->
  <g transform="translate(640, 75)">
    <rect width="310" height="150" rx="10" fill="#090d16" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5" />
    <!-- Window Dots -->
    <circle cx="20" cy="20" r="5" fill="#ef4444" />
    <circle cx="36" cy="20" r="5" fill="#f59e0b" />
    <circle cx="52" cy="20" r="5" fill="#10b981" />
    <text x="75" y="24" font-family="monospace" font-size="11" fill="#64748b">sarthak@dev-hud:~</text>
    <line x1="0" y1="36" x2="310" y2="36" stroke="#1e293b" stroke-width="1" />

    <!-- Terminal Lines -->
    <g font-family="'Courier New', Courier, monospace" font-size="12.5">
      <text x="18" y="62" fill="#38bdf8">$ <tspan fill="#e2e8f0">whoami</tspan></text>
      <text x="18" y="82" fill="#10b981">&gt; Backend &amp; AI Builder</text>
      <text x="18" y="108" fill="#38bdf8">$ <tspan fill="#e2e8f0">stack --primary</tspan></text>
      <text x="18" y="128" fill="#a855f7">&gt; [Node, React, MySQL, LLMs]</text>
    </g>
  </g>
</svg>
